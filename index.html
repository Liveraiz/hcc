<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f141b">
  <!-- 휴대폰 '홈 화면에 추가' 시 앱처럼 열리게 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="수술 조회">
  <title>수술 작업 조회</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f141b; overflow: hidden; }
    iframe {
      border: 0; display: block; width: 100%;
      height: 100vh;      /* 구형 브라우저용 */
      height: 100dvh;     /* 모바일 주소창 높이 변화 대응 */
    }
    #fsBtn {
      position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 10; width: 44px; height: 44px; border-radius: 22px;
      border: 1px solid rgba(255,255,255,.25); background: rgba(15,20,27,.6);
      color: #fff; font-size: 20px; line-height: 1; cursor: pointer;
      opacity: .6; -webkit-tap-highlight-color: transparent;
    }
    #fsBtn:active { opacity: 1; }
    /* 링크를 새 탭 대신 같은 페이지 안에서 띄우는 레이어 (전체화면 유지용) */
    #viewer {
      position: fixed; inset: 0; z-index: 5; display: none;
      flex-direction: column; background: #0f141b;
    }
    #viewer.open { display: flex; }
    #viewerBar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top));
      background: #161d27; color: #fff; font: 15px/1.3 system-ui, sans-serif;
    }
    #viewerBar button, #viewerBar a {
      flex: 0 0 auto; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25);
      background: transparent; color: #fff; font: inherit; text-decoration: none; cursor: pointer;
    }
    #viewerTitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #viewer iframe { flex: 1; height: auto; }
    #fsHint {
      position: fixed; left: 50%; bottom: calc(68px + env(safe-area-inset-bottom));
      transform: translateX(-50%); z-index: 10; max-width: 80vw; padding: 10px 14px;
      border-radius: 8px; background: rgba(0,0,0,.85); color: #fff;
      font: 14px/1.4 system-ui, sans-serif; text-align: center; display: none;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbxcxtfNpUuPKXTGKEkxPlPnZaM_7_SQMSQ-5R5NYYyZlVmuRdLGXph77CQY4k22IkR7/exec"
    title="수술 작업 조회"
    allow="clipboard-write">
  </iframe>
  <div id="viewer">
    <div id="viewerBar">
      <button id="viewerBack" type="button">← 목록</button>
      <span id="viewerTitle"></span>
      <a id="viewerExt" href="#" target="_blank" rel="noopener">새 탭 ↗</a>
    </div>
  </div>
  <button id="fsBtn" type="button" aria-label="전체화면" title="전체화면">⛶</button>
  <div id="fsHint">이 기기의 브라우저는 전체화면을 지원하지 않습니다.<br>공유 → '홈 화면에 추가'로 열면 주소창 없이 볼 수 있어요.</div>
  <script>
    (function () {
      var btn = document.getElementById('fsBtn');
      var hint = document.getElementById('fsHint');
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      function current() { return document.fullscreenElement || document.webkitFullscreenElement; }

      // 홈 화면 앱(standalone)으로 열린 경우엔 이미 주소창이 없으므로 버튼 숨김
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
        btn.style.display = 'none';
        return;
      }

      function sync() {
        var on = !!current();
        btn.textContent = on ? '✕' : '⛶';
        btn.setAttribute('aria-label', on ? '전체화면 종료' : '전체화면');
        btn.title = btn.getAttribute('aria-label');
      }
      document.addEventListener('fullscreenchange', sync);
      document.addEventListener('webkitfullscreenchange', sync);

      btn.addEventListener('click', function () {
        if (!req) {  // iPhone Safari 등 Fullscreen API 미지원
          hint.style.display = 'block';
          setTimeout(function () { hint.style.display = 'none'; }, 4000);
          return;
        }
        if (current()) exit.call(document);
        else {
          var r = req.call(el);
          if (r && r.catch) r.catch(function () {});
        }
      });
    })();

    // Apps Script 화면의 링크를 새 탭 대신 이 페이지 안의 레이어로 열기.
    // 새 탭으로 가면 전체화면이 풀리기 때문. Apps Script 쪽에서 postMessage로 요청을 보내야 동작함.
    (function () {
      var viewer = document.getElementById('viewer');
      var title = document.getElementById('viewerTitle');
      var ext = document.getElementById('viewerExt');
      var frame = null;
      var GAS_ORIGIN = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;

      function open(url, label) {
        close();
        // 매번 새 iframe을 만들어야 방문 기록(뒤로가기)에 쌓이지 않음
        frame = document.createElement('iframe');
        frame.src = url;
        frame.title = label || '링크';
        frame.setAttribute('allow', 'fullscreen; clipboard-write; xr-spatial-tracking');
        viewer.appendChild(frame);
        title.textContent = label || url;
        ext.href = url;
        viewer.classList.add('open');
      }
      function close() {
        if (frame) { frame.remove(); frame = null; }
        viewer.classList.remove('open');
      }
      document.getElementById('viewerBack').addEventListener('click', close);
      // 새 탭으로 열면 어차피 전체화면이 풀리므로 레이어는 닫아 둠
      ext.addEventListener('click', function () { setTimeout(close, 0); });

      window.addEventListener('message', function (e) {
        if (!GAS_ORIGIN.test(e.origin)) return;
        var d = e.data || {};
        if (d.type === 'hcc-hello') {
          e.source.postMessage({ type: 'hcc-wrapper' }, e.origin);
        } else if (d.type === 'hcc-open' && /^https?:\/\//i.test(d.url || '')) {
          open(d.url, d.label);
        }
      });
    })();
  </script>
</body>
</html>
